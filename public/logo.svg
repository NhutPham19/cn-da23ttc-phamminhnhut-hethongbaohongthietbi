<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Nền Badge bo góc hiện đại chuẩn Enterprise -->
  <rect width="48" height="48" rx="12" fill="url(#logo_gradient)"/>
  
  <!-- Khung màn hình thiết bị / Phần cứng giám sát -->
  <rect x="11" y="11" width="26" height="18" rx="2.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
  
  <!-- Chân đế thiết bị vững chắc -->
  <path d="M24 29v5M18 34h12" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Tín hiệu hoạt động & Dấu kiểm bảo trì thành công bên trong màn hình -->
  <path d="M17 20l4.5 4.5 9.5-9.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Điểm nhấn trạng thái (Status Signal Pulse) góc phải -->
  <circle cx="33" cy="15" r="2" fill="#38BDF8"/>

  <defs>
    <linearGradient id="logo_gradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
</svg>
